upstream am_web { server 127.0.0.1:3004; }
ssl_certificate /etc/nginx/ssl/selfsigned.crt;
ssl_certificate_key /etc/nginx/ssl/selfsigned.key;
# ── DEFAULT SERVER: beautiful landing page for unconfigured domains ──
# Any Host that doesn't match a specific server_name below falls here.
# Serves /var/www/default/index.html (single-file static page, no deps).
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  listen 443 ssl default_server;
  listen [::]:443 ssl default_server;
  server_name _;
  root /var/www/default;
  index index.html;
  location / {
    try_files $uri $uri/ /index.html;
  }
  location ~* \.(svg|ico|png|jpg|jpeg|gif|webp|woff2?|ttf|css|js)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
  }
}
# ── Rara AI assistant ──
server { listen 80; listen [::]:80; listen 443 ssl; listen [::]:443 ssl; server_name rara.ai.id www.rara.ai.id; location / { proxy_pass http://rara_web; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; } }
