upstream am_web { server 127.0.0.1:3004; }

# ── AM Web — the JJ video editor ──
# The application runs in the browser; the server only hands out the files
# and forwards the Alight Motion requests the browser is not allowed to make.
#
# Cloudflare Flexible SSL note: CF terminates SSL at the edge, then connects
# to origin (this server) on plain HTTP port 80. The browser still sees
# HTTPS — secure context for WebCodecs encoder is preserved. We MUST NOT
# redirect port 80 → 443 here, otherwise CF→HTTP→301→HTTPS→CF→HTTP→...
# creates an ERR_TOO_MANY_REDIRECTS loop.

# Port 80 — direct proxy (CF Flexible SSL hits this, no redirect).
server {
  listen 80;
  listen [::]:80;
  server_name amrenderstudio.kangwifi.eu.org am.kangwifi.eu.org amweb.kangwifi.eu.org 209.50.50.121;

  # Keep ACME challenge accessible for certbot renewal.
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/acme;
    default_type "text/plain";
  }

  location / {
    proxy_pass http://am_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_read_timeout 600s;
    client_max_body_size 512m;
  }
}

# Port 443 — direct HTTPS access (no CF in path, e.g. for testing).
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name amrenderstudio.kangwifi.eu.org am.kangwifi.eu.org amweb.kangwifi.eu.org 209.50.50.121;

  ssl_certificate /etc/nginx/ssl/am-web.crt;
  ssl_certificate_key /etc/nginx/ssl/am-web.key;

  location / {
    proxy_pass http://am_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_read_timeout 600s;
    client_max_body_size 512m;
  }
}

# Port 8881 — direct firewall passthrough (same as 443 but on alt port).
server {
  listen 8881 ssl;
  listen [::]:8881 ssl;
  server_name _;

  ssl_certificate /etc/nginx/ssl/am-web.crt;
  ssl_certificate_key /etc/nginx/ssl/am-web.key;

  location / {
    proxy_pass http://am_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_read_timeout 600s;
    client_max_body_size 512m;
  }
}
